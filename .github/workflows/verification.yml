name: RH Planner verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'repair/**'
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-planner-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Build, Typecheck, Lint, Unit, Integration & Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Non-planning package unit and HTTP tests
        run: pnpm exec turbo run test --concurrency=2 "--filter=!@ai-floor-planner/planning-engine"
      - name: Planning-engine unit tests
        run: pnpm --filter @ai-floor-planner/planning-engine exec vitest run --pool=threads --poolOptions.threads.maxThreads=2 --exclude "**/phase0-generation-benchmark.test.ts"
      - name: Monorepo integration tests
        run: pnpm test:integration
      - name: Backend integration tests
        run: pnpm --filter @ai-floor-planner/backend run test:integration
      - name: Install Chromium
        run: pnpm --filter @ai-floor-planner/frontend exec playwright install --with-deps chromium
      - name: Production Chromium E2E repair & CAD Studio tests
        run: pnpm --filter @ai-floor-planner/frontend run test:e2e:repair
      - name: Real Chromium WebGL context recovery tests
        run: pnpm --filter @ai-floor-planner/frontend run test:e2e:webgl
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: packages/frontend/test-results/
          if-no-files-found: ignore

  planning-benchmark:
    name: 288-Case Planning Matrix Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter=@ai-floor-planner/planning-engine...
      - name: Run 288-case planning benchmark
        run: pnpm --filter @ai-floor-planner/planning-engine exec vitest run src/__tests__/phase0-generation-benchmark.test.ts
